name: CAD tests
on:
  pull_request:
    paths:
      - 'brickcad/**/*.py'
      - 'parts/**/*.py'
      - 'parts/**/*.json'
      - 'experiments/**/*.py'
      - 'experiments/**/*.json'
      - 'profiles/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'scripts/ci-tests.py'
      - 'scripts/cad_versions.py'
      - 'scripts/cad_retry.py'
      - 'scripts/test_cad_retry.py'
      - 'scripts/test_cad_versions.py'
      - 'scripts/cad_report.py'
      - 'scripts/test_cad_report.py'
      - '.github/workflows/cad.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cad-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test version planner and report contract (no CAD dependencies)
        run: |
          python -m unittest discover -s scripts -p test_cad_versions.py -v
          python -m unittest discover -s scripts -p test_cad_retry.py -v
          python -m unittest discover -s scripts -p test_cad_report.py -v
      - name: Select affected tests
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/ci-tests.py ${BASE_SHA:+--base "$BASE_SHA"} --plan
      - uses: actions/setup-python@v5
        if: steps.plan.outputs.has_tests == 'true'
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
        if: steps.plan.outputs.has_tests == 'true'
      - name: Run affected tests once
        if: steps.plan.outputs.has_tests == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/ci-tests.py ${BASE_SHA:+--base "$BASE_SHA"}
