name: CAD verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m brickcad all --profile profiles/first-print.json --out build/first-print
      - run: python -m brickcad build --profile profiles/nominal.json --out build/nominal
      - run: python -m brickcad all
      - run: python -m brickcad build --profile profiles/duplo-2x2.json --out build/duplo-2x2
      - run: python -m brickcad.calibration
      - run: npm run browser:check -- build/sim2real-duplo/view-5 build/sim2real-duplo/browser-qa
      - run: python scripts/review-sheet.py build/sim2real-duplo/browser-qa
      - run: npm run browser:check -- build/duplo-2x4 build/duplo-browser-qa
      - run: python scripts/review-sheet.py build/duplo-browser-qa
      - run: npm run browser:check -- build/first-print build/browser-qa
      - run: python scripts/review-sheet.py build/browser-qa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brick-cad-and-verification
          path: build/
          retention-days: 30

