name: Issue37 follow-up plates (fast CI, manual CAD build)
on:
  push:
    paths:
      - "brickcad/course_windows.py"
      - "brickcad/course_double_windows.py"
      - "brickcad/course_lancet_windows.py"
      - "brickcad/course_visibility_windows.py"
      - "scripts/course_followup_print.py"
      - "scripts/course_overnight_plate.py"
      - "experiments/course_validation_plate/**"
      - "experiments/course_followup_plate/**"
      - "tests/test_course_followup_print.py"
      - "tests/test_course_overnight_plate.py"
      - "tests/test_course_double_windows.py"
      - "tests/test_course_lancet_windows.py"
      - "tests/test_course_visibility_windows.py"
      - "tests/test_course_validation_plate.py"
      - ".github/workflows/course-followup-plates.yml"
  pull_request:
    paths:
      - 'brickcad/course_windows.py'
      - 'brickcad/course_double_windows.py'
      - 'brickcad/course_lancet_windows.py'
      - 'brickcad/course_visibility_windows.py'
      - 'scripts/course_followup_print.py'
      - 'scripts/course_overnight_plate.py'
      - 'experiments/course_validation_plate/**'
      - 'experiments/course_followup_plate/**'
      - 'tests/test_course_followup_print.py'
      - 'tests/test_course_overnight_plate.py'
      - 'tests/test_course_double_windows.py'
      - 'tests/test_course_lancet_windows.py'
      - 'tests/test_course_visibility_windows.py'
      - 'tests/test_course_validation_plate.py'
      - '.github/workflows/course-followup-plates.yml'
  workflow_dispatch:
    inputs:
      set:
        description: "Which print set: all, missing, windows, or overnight best 9?"
        required: true
        default: all
        type: choice
        options: [all, missing, windows, overnight]
permissions:
  contents: read
jobs:
  plan-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install "opencv-python-headless>=4.12,<5"
      - name: Validate both plate plans without slow geometry
        run: python -m unittest tests.test_course_followup_print tests.test_course_double_windows tests.test_course_lancet_windows tests.test_course_visibility_windows tests.test_course_overnight_plate tests.test_course_validation_plate tests.test_course_catalog tests.test_course_contract -v
      - run: python scripts/course_catalog.py --mode validate
  # Avoid accidental multi-minute STL runs from commit-message flags.
  missing:
    if: github.event_name == 'workflow_dispatch' && (inputs.set == 'all' || inputs.set == 'missing')
    needs: plan-tests
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Independently regenerate all seven PR56 models missing real-world verification
        run: python scripts/course_followup_print.py --set missing
      - uses: actions/upload-artifact@v4
        with:
          name: issue37-followup-missing-${{ github.run_id }}
          path: build/course-followup-plates/missing/
          retention-days: 14
          if-no-files-found: error
  windows:
    if: github.event_name == 'workflow_dispatch' && (inputs.set == 'all' || inputs.set == 'windows')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Generate six separately versioned large tunnel window pilot meshes
        run: python scripts/course_followup_print.py --set windows
      - uses: actions/upload-artifact@v4
        with:
          name: issue37-followup-windows-${{ github.run_id }}
          path: build/course-followup-plates/windows/
          retention-days: 14
          if-no-files-found: error
  # Full 9-part OCC/BRep + STL generation takes ~11 minutes. It is intentionally
  # manual-only; ordinary PR/push checks run plan-tests (~30 seconds) instead.
  # Use Actions > workflow_dispatch (set=overnight/all) to regenerate print assets.
  overnight:
    if: github.event_name == 'workflow_dispatch' && (inputs.set == 'all' || inputs.set == 'overnight')
    needs: plan-tests
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install "opencv-python-headless>=4.12,<5"
      - name: Independently build nine meshes including both-side windows on all four unprinted tunnels
        run: python scripts/course_overnight_plate.py
      - uses: actions/upload-artifact@v4
        with:
          name: issue37-overnight-visible-9parts-${{ github.run_id }}
          path: build/course-overnight-plate/
          retention-days: 14
          if-no-files-found: error
