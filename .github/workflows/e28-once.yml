name: E28 one-time artifact verification
on:
  push:
    branches:
      - ops/e28-artifact-check-20261031
    paths:
      - .github/workflows/e28-once.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e28:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CAD dependencies
        run: python -m pip install -r requirements.txt
      - name: Targeted E28 geometry tests and STL generation with snapshots
        run: python scripts/cad_versions.py --mode build --targets experiments/receiver_contact_e28
      - name: Upload E28 STLs, reports and four-view previews
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cad-verified-stl
          path: build/cad-delivery/
          if-no-files-found: error
          retention-days: 14
      - name: Upload stage diagnostics if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-e28-stages
          path: build/stages/
          if-no-files-found: ignore
          retention-days: 7
