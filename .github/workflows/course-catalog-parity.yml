name: Issue37 independent CAD vs original BRep parity
on:
  push:
    paths:
      - 'tests/test_course_catalog_parity.py'
      - '.github/workflows/course-catalog-parity.yml'
  workflow_dispatch:
    inputs:
      models:
        description: 'all or comma-separated CAD IDs'
        required: true
        default: 'all'
        type: string
permissions:
  contents: read
concurrency:
  group: course-catalog-parity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      COURSE_PARITY_MODELS: ${{ github.event_name == 'workflow_dispatch' && inputs.models || (github.event_name == 'push' && contains(github.event.head_commit.message, '[course-all]') && 'all') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[course-T01]') && 'T01-V6') || 'GC01-V5' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest tests.test_course_catalog_parity -v
