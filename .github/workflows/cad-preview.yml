name: CAD preview and print artifact
on:
  pull_request:
    paths:
      - '.github/workflows/cad-preview.yml'
      - 'scripts/package_print_stl.py'
      - 'scripts/test_package_print_stl.py'
      - 'parts/play_set/**'
      - 'experiments/pr20_comparison/**'
      - 'parts/tunnel/**'
      - 'parts/elbow/**'
      - 'parts/sloped_curve/**'
      - 'brickcad/**'
      - 'requirements.txt'
  workflow_dispatch:
    inputs:
      target:
        description: Model or 8-piece printable set
        type: choice
        options: [play-set-8, duplo, duplo-2x2, rail, brick, tunnel, elbow, pitagora, sloped_curve, calibration, experiment, stud-holes, stud-combined, receiver-trial, xy-trial, lego]
        default: tunnel
      screenshots:
        description: Browser screenshots (skipped for play-set-8)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: cad-preview-${{ github.ref }}-${{ inputs.target }}
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verify artifact packaging without running CAD
        if: github.event_name == 'pull_request' || inputs.target == 'play-set-8'
        run: python -m unittest scripts.test_package_print_stl -v
      - name: Generate the PR20 print set on the runner (no browser)
        if: github.event_name == 'pull_request' || inputs.target == 'play-set-8'
        run: |
          python scripts/run-stage.py --name tunnel --timeout 900 --artifact build/print-source/tunnel/brick.stl -- python -m parts.tunnel.design --out build/print-source/tunnel
          python scripts/run-stage.py --name elbow --timeout 900 --artifact build/print-source/elbow/brick.stl -- python -m parts.elbow.design --out build/print-source/elbow
          python scripts/run-stage.py --name sloped-curve --timeout 900 --artifact build/print-source/sloped_curve/brick.stl -- python -m parts.sloped_curve.design --out build/print-source/sloped_curve
          python scripts/run-stage.py --name comparison --timeout 1500 --artifact build/pr20-comparison/S02-V2/brick.stl -- python -m experiments.pr20_comparison.design
          python scripts/run-stage.py --name assemble-eight --timeout 900 --artifact build/print-source/batch/play-set-8.stl -- python -m parts.play_set.design --parts-root build/print-source --out build/print-source/batch --alternatives-root build/pr20-comparison
      - name: Check and package print-ready STL files
        if: github.event_name == 'pull_request' || inputs.target == 'play-set-8'
        run: python scripts/package_print_stl.py --parts-root build/print-source --comparison-root build/pr20-comparison --out build/print-ready
      - name: Upload print-ready STL artifact
        if: github.event_name == 'pull_request' || inputs.target == 'play-set-8'
        uses: actions/upload-artifact@v4
        with:
          name: print-ready-play-set-8
          path: build/print-ready/
          if-no-files-found: error
          retention-days: 14
      - name: Save stage logs if remote generation fails
        if: failure() && (github.event_name == 'pull_request' || inputs.target == 'play-set-8')
        uses: actions/upload-artifact@v4
        with:
          name: failed-print-stages
          path: build/stages/
          if-no-files-found: ignore
          retention-days: 7
      - name: Generate and verify selected model once
        if: github.event_name == 'workflow_dispatch' && inputs.target != 'play-set-8'
        env:
          TARGET: ${{ inputs.target }}
        run: |
          case "$TARGET" in
            duplo) python -m brickcad build --out build/model ;;
            duplo-2x2) python -m brickcad build --profile experiments/nominal_duplo_2x2/profile.json --out build/model ;;
            rail|brick) python -m parts.straight_rail.design --kind "$TARGET" --out build/model ;;
            tunnel|elbow|sloped_curve) python -m "parts.$TARGET.design" --out build/model ;;
            pitagora) python -m experiments.pitagora_m1.design --out build/model ;;
            receiver-trial) python -m experiments.receiver_fit.design --out build/model ;;
            stud-combined) python -m experiments.stud_inner_wall.design --stage combined --hole 6.40 --out build/model ;;
            stud-holes) python -m experiments.stud_inner_wall.design --out build/model ;;
            xy-trial) python -m experiments.xy_fit.design --out build/model ;;
            experiment) python -m experiments.full_height_fit.design --out build/model ;;
            calibration) python -m experiments.initial_calibration.design build/model ;;
            lego) python -m brickcad build --profile experiments/lego_first_print/profile.json --out build/model ;;
            *) exit 1 ;;
          esac
      - uses: actions/setup-node@v4
        if: github.event_name == 'workflow_dispatch' && inputs.screenshots && inputs.target != 'play-set-8'
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
        if: github.event_name == 'workflow_dispatch' && inputs.screenshots && inputs.target != 'play-set-8'
      - run: npx playwright install --with-deps chromium
        if: github.event_name == 'workflow_dispatch' && inputs.screenshots && inputs.target != 'play-set-8'
      - name: Capture selected model once
        if: github.event_name == 'workflow_dispatch' && inputs.screenshots && inputs.target != 'play-set-8'
        env:
          TARGET: ${{ inputs.target }}
        run: |
          case "$TARGET" in
            sloped_curve) node scripts/sloped-curve-browser-check.cjs build/model build/browser-qa ;;
            elbow) node scripts/elbow-browser-check.cjs build/model build/browser-qa ;;
            pitagora) node scripts/pitagora-browser-check.cjs build/model build/browser-qa ;;
            receiver-trial) npm run browser:check -- build/model/02 build/browser-qa ;;
            stud-combined) npm run browser:check -- build/model/03 build/browser-qa ;;
            stud-holes) npm run browser:check -- build/model/03 build/browser-qa ;;
            experiment) npm run browser:check -- build/model/sample build/browser-qa ;;
            calibration) npm run browser:check -- build/model/view-5 build/browser-qa ;;
            *) npm run browser:check -- build/model build/browser-qa ;;
          esac
          python scripts/review-sheet.py build/browser-qa
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch' && inputs.target != 'play-set-8'
        with:
          name: brick-cad-and-verification
          path: build/
          retention-days: 7

