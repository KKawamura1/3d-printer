name: CAD preview and print artifacts
on:
  push:
    paths:
      - 'parts/**/*.py'
      - 'parts/**/cad-build.json'
      - 'experiments/**/*.py'
      - 'experiments/**/cad-build.json'
      - 'brickcad/**'
      - 'profiles/**'
      - 'requirements.txt'
      - 'scripts/cad-artifacts.py'
      - 'scripts/cad_versions.py'
      - 'scripts/test_cad_versions.py'
      - 'scripts/cad-capture.cjs'
      - 'scripts/test_cad_artifacts.py'
      - 'scripts/run-stage.py'
      - 'scripts/package_print_stl.py'
      - '.github/workflows/cad-preview.yml'
  workflow_dispatch:
    inputs:
      targets:
        description: 'all or comma-separated model paths, e.g. parts/tunnel'
        type: string
        default: parts/tunnel
      previews:
        description: 'Capture Chromium views for generated models'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: cad-artifacts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check incremental planner
        run: |
          python -m unittest discover -s scripts -p test_cad_artifacts.py -v
          python -m unittest discover -s scripts -p test_cad_versions.py -v
          python -m unittest discover -s scripts -p test_run_stage.py -v
      - name: Plan changed models
        id: plan
        env:
          BEFORE_SHA: ${{ github.event.before || github.event.pull_request.before || github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TARGETS: ${{ inputs.targets }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            python scripts/cad_versions.py --mode plan --targets "$INPUT_TARGETS"
          else
            python scripts/cad_versions.py --mode plan --base "$BEFORE_SHA"
          fi
      - uses: actions/setup-python@v5
        if: steps.plan.outputs.has_models == 'true'
        with:
          python-version: '3.11'
          cache: pip
      - name: Restore revision-keyed CAD outputs
        if: steps.plan.outputs.has_models == 'true'
        uses: actions/cache@v4
        with:
          path: build/cad-artifacts
          key: cad-v2-${{ runner.os }}-${{ hashFiles('parts/**/cad-build.json', 'experiments/**/cad-build.json') }}
          restore-keys: |
            cad-v2-${{ runner.os }}-
      - name: Install CAD dependencies
        if: steps.plan.outputs.has_models == 'true'
        run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        if: steps.plan.outputs.has_models == 'true' && inputs.previews == true
        with:
          node-version: '22'
          cache: npm
      - name: Install optional Chromium
        if: steps.plan.outputs.has_models == 'true' && inputs.previews == true
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Build and validate selected STL files
        if: steps.plan.outputs.has_models == 'true'
        env:
          SELECTED: ${{ steps.plan.outputs.targets }}
          PREVIEWS: ${{ inputs.previews }}
        run: |
          if [ "$PREVIEWS" = true ]; then
            python scripts/cad_versions.py --mode build --targets "$SELECTED" --previews
          else
            python scripts/cad_versions.py --mode build --targets "$SELECTED"
          fi
      - name: Upload STL and optional screenshots
        if: steps.plan.outputs.has_models == 'true' && success()
        uses: actions/upload-artifact@v4
        with:
          name: cad-verified-stl
          path: build/cad-delivery/
          if-no-files-found: error
          retention-days: 14
      - name: Upload stage logs on failure
        if: failure() && steps.plan.outputs.has_models == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: failed-cad-stages
          path: build/stages/
          if-no-files-found: ignore
          retention-days: 7
