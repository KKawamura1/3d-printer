name: CAD preview and print artifacts
on:
  # Re-plan on every PR update, including test-only fixes and earlier missing STL.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    paths:
      - 'parts/**/*.py'
      - 'parts/**/cad-build.json'
      - 'experiments/**/*.py'
      - 'experiments/**/cad-build.json'
      - 'brickcad/**'
      - 'profiles/**'
      - 'requirements.txt'
      - 'scripts/cad-artifacts.py'
      - 'scripts/cad_versions.py'
      - 'scripts/cad_retry.py'
      - 'scripts/test_cad_retry.py'
      - 'scripts/cad_report.py'
      - 'scripts/test_cad_report.py'
      - 'scripts/stl_snapshot.py'
      - 'scripts/test_stl_snapshot.py'
      - 'scripts/test_cad_versions.py'
      - 'scripts/cad-capture.cjs'
      - 'scripts/test_cad_artifacts.py'
      - 'scripts/run-stage.py'
      - 'scripts/package_print_stl.py'
      - '.github/workflows/cad-preview.yml'
  workflow_dispatch:
    inputs:
      repair_pr:
        description: 'Optional open PR number; build its latest head instead of the selected workflow branch'
        type: string
        default: ''
      targets:
        description: 'changed (PR diff), all, or comma-separated model paths, e.g. parts/tunnel'
        type: string
        default: changed
      previews:
        description: 'Capture Chromium views for generated models'
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: cad-artifacts-${{ github.event.pull_request.number || inputs.repair_pr || github.ref }}
  cancel-in-progress: true
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Resolve manually requested PR
        id: recovery
        if: github.event_name == 'workflow_dispatch' && inputs.repair_pr != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPAIR_PR: ${{ inputs.repair_pr }}
        run: |
          set -euo pipefail
          if ! [[ "$REPAIR_PR" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::repair_pr must be a positive PR number"
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/pulls/$REPAIR_PR" > "$RUNNER_TEMP/cad-repair-pr.json"
          pr="$RUNNER_TEMP/cad-repair-pr.json"
          if [ "$(jq -r .state "$pr")" != open ]; then
            echo "::error::PR #$REPAIR_PR is not open"
            exit 1
          fi
          if [ "$(jq -r .head.repo.full_name "$pr")" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::PR #$REPAIR_PR must have a branch in this repository"
            exit 1
          fi
          echo "head_sha=$(jq -r .head.sha "$pr")" >> "$GITHUB_OUTPUT"
          echo "base_sha=$(jq -r .base.sha "$pr")" >> "$GITHUB_OUTPUT"
          echo "Repairing PR #$REPAIR_PR at $(jq -r .head.sha "$pr")"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.recovery.outputs.head_sha || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Check incremental planner
        run: |
          python -m unittest discover -s scripts -p test_cad_artifacts.py -v
          python -m unittest discover -s scripts -p test_cad_versions.py -v
          python -m unittest discover -s scripts -p test_cad_retry.py -v
          python -m unittest discover -s scripts -p test_cad_report.py -v
          python -m unittest discover -s scripts -p test_run_stage.py -v
      - name: Detect failed previous CAD runs
        id: retry
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/cad_retry.py
      - name: Plan changed models
        id: plan
        env:
          BEFORE_SHA: ${{ steps.recovery.outputs.base_sha || github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TARGETS: ${{ inputs.targets }}
          RETRY_BASE: ${{ steps.retry.outputs.retry_base }}
          REPAIR_PR: ${{ inputs.repair_pr }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = pull_request ] || [ -n "$REPAIR_PR" ]; then
            # The PR base may have advanced; use the actual common ancestor.
            if [ "$EVENT_NAME" = workflow_dispatch ] && [ "$INPUT_TARGETS" != changed ]; then
              python scripts/cad_versions.py --mode plan --targets "$INPUT_TARGETS"
            else
              base="$(git merge-base HEAD "$BEFORE_SHA")"
              python scripts/cad_versions.py --mode plan --base "$base"
            fi
          elif [ "$EVENT_NAME" = workflow_dispatch ]; then
            python scripts/cad_versions.py --mode plan --targets "$INPUT_TARGETS"
          else
            if [ -n "$RETRY_BASE" ]; then
              python scripts/cad_versions.py --mode plan --base "$BEFORE_SHA" --retry-base "$RETRY_BASE"
            else
              python scripts/cad_versions.py --mode plan --base "$BEFORE_SHA"
            fi
          fi
      - name: Fail rather than report a successful empty manual repair
        if: github.event_name == 'workflow_dispatch' && steps.plan.outputs.has_models != 'true'
        run: |
          echo "::error::No STL targets selected. Set targets to a part path (including auto:false models) or all."
          exit 1
      - name: Explain when no new STL is expected
        if: github.event_name != 'workflow_dispatch' && steps.plan.outputs.has_models != 'true'
        run: echo "::notice::No new or bumped CAD revisions in this diff; no STL artifact is expected."
      - uses: actions/setup-python@v5
        if: steps.plan.outputs.has_models == 'true'
        with:
          python-version: '3.11'
          cache: pip
      - name: Restore revision-keyed CAD outputs
        if: steps.plan.outputs.has_models == 'true'
        uses: actions/cache@v4
        with:
          path: build/cad-artifacts
          key: cad-v3-${{ runner.os }}-${{ hashFiles('parts/**/cad-build.json', 'experiments/**/cad-build.json') }}
          restore-keys: |
            cad-v3-${{ runner.os }}-
      - name: Install CAD dependencies
        if: steps.plan.outputs.has_models == 'true'
        run: pip install -r requirements.txt
      - name: Test STL snapshot rendering
        if: steps.plan.outputs.has_models == 'true'
        run: python -m unittest discover -s scripts -p test_stl_snapshot.py -v
      - uses: actions/setup-node@v4
        if: steps.plan.outputs.has_models == 'true' && inputs.previews == true
        with:
          node-version: '22'
          cache: npm
      - name: Install optional Chromium
        if: steps.plan.outputs.has_models == 'true' && inputs.previews == true
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Build and validate selected STL files
        if: steps.plan.outputs.has_models == 'true'
        env:
          SELECTED: ${{ steps.plan.outputs.targets }}
          PREVIEWS: ${{ inputs.previews }}
        run: |
          if [ "$PREVIEWS" = true ]; then
            python scripts/cad_versions.py --mode build --targets "$SELECTED" --previews
          else
            python scripts/cad_versions.py --mode build --targets "$SELECTED"
          fi
      - name: Upload STL and optional screenshots
        if: steps.plan.outputs.has_models == 'true' && success()
        uses: actions/upload-artifact@v4
        with:
          name: cad-verified-stl
          path: build/cad-delivery/
          if-no-files-found: error
          retention-days: 14
      - name: Upload stage logs on failure
        if: failure() && steps.plan.outputs.has_models == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: failed-cad-stages
          path: build/stages/
          if-no-files-found: ignore
          retention-days: 7
