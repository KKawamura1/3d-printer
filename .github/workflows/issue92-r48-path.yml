name: Issue92 shared R48 open and tunnel path

on:
  push:
    branches: [feature/issue92-r48-shared-path]
    paths:
      - brickcad/r48_path.py
      - brickcad/course_loft_family.py
      - brickcad/course_r48_unified.py
      - experiments/r48_unified_issue89/test_open_roofed_path.py
      - .github/workflows/issue92-r48-path.yml
  pull_request:
    paths:
      - brickcad/r48_path.py
      - brickcad/course_loft_family.py
      - brickcad/course_r48_unified.py
      - experiments/r48_unified_issue89/test_open_roofed_path.py
      - .github/workflows/issue92-r48-path.yml

permissions:
  contents: read

concurrency:
  group: issue92-r48-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared-path:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned Python environment
        run: python -m pip install -r requirements.txt
      - name: Verify existing open R48 and new roofed R48 path contracts
        run: |
          python -m unittest experiments.r48_unified_issue89.test_open_roofed_path -v
          python -m unittest experiments.r48_unified_issue89.test_contract -v
