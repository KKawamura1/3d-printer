name: Issue 37 multi-part A1 mini print plates
on:
  push:
    paths:
      - 'experiments/issue37_bulk_print/**'
      - '.github/workflows/issue37-bulk-print.yml'
  workflow_dispatch:
    inputs:
      plates:
        description: 'Plate to build'
        required: true
        type: choice
        default: '1'
        options:
          - '1'
          - '2'
          - '3'
          - 'all'
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  build-print-plates:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PLATES: ${{ inputs.plates || '1' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install mesh library
        run: python -m pip install numpy==2.3.5

      - name: Reject superseded PR commits or mismatched CAD versions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r pr sha part_id part_dir legacy; do
            if [[ "${pr}" != "0" ]]; then
              current_sha=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}" --jq '.head.sha')
              if [[ "${current_sha}" != "${sha}" ]]; then
                echo "::error::PR #${pr} changed; repin the current CAD before using the plate."
                exit 1
              fi
            fi
            if [[ "${legacy}" != "True" ]]; then
              version=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${part_dir}/cad-build.json?ref=${sha}" --jq '.content' | base64 --decode | python -c 'import json,sys; print(json.load(sys.stdin)["version"])')
              if [[ "${version}" != "${part_id}" ]]; then
                echo "::error::CAD target version ${version} differs from pinned ${part_id}"
                exit 1
              fi
            fi
          done < <(python - <<'PY'
          import json, os
          from pathlib import PurePosixPath
          selected={1,2,3} if os.environ['PLATES']=='all' else {int(os.environ['PLATES'])}
          for it in json.load(open('experiments/issue37_bulk_print/sources.json'))['items']:
              if it['plate'] not in selected: continue
              print(it['pr'], it['head_sha'], it['id'], PurePosixPath(it['path']).parent.parent, bool(it.get('repository_stl')), sep='\t')
          PY
          )

      - name: Download immutable successful CAD artifacts once per run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r pr run artifact; do
            echo "Downloading PR #${pr} run ${run} artifact ${artifact}"
            conclusion=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run}" --jq '.conclusion')
            if [[ "${conclusion}" != "success" ]]; then
              echo "::error::Pinned run ${run} is not successful"
              exit 1
            fi
            actual=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run}/artifacts" --jq '.artifacts[] | select(.name=="cad-verified-stl" and .expired==false) | .id')
            if [[ "${actual}" != "${artifact}" ]]; then
              echo "::error::Pinned CAD artifact missing or expired: ${artifact}"
              exit 1
            fi
            mkdir -p "build/issue37-sources/pr${pr}"
            gh run download "${run}" --name cad-verified-stl --dir "build/issue37-sources/pr${pr}"
          done < <(python - <<'PY'
          import json, os
          selected={1,2,3} if os.environ['PLATES']=='all' else {int(os.environ['PLATES'])}
          s=set()
          for it in json.load(open('experiments/issue37_bulk_print/sources.json'))['items']:
              if it['plate'] not in selected or it.get('rebuild_from_source') or it.get('repository_stl'): continue
              s.add((it['pr'],it['run'],it['artifact']))
          for row in sorted(s): print(*row,sep='\t')
          PY
          )

      - name: Rebuild only selected unavailable CAD targets at immutable commits
        shell: bash
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r pr sha targets; do
            echo "Rebuilding only ${targets} from ${sha}"
            worktree="${RUNNER_TEMP}/issue37-source-pr${pr}"
            git fetch origin "${sha}"
            git worktree add --detach "${worktree}" "${sha}"
            (
              cd "${worktree}"
              python -m pip install -r requirements.txt
              python scripts/cad_versions.py --mode build --targets "${targets}"
            )
            mkdir -p "build/issue37-sources/pr${pr}"
            cp -a "${worktree}/build/cad-delivery/." "build/issue37-sources/pr${pr}/"
          done < <(python - <<'PY'
          import json, os
          from pathlib import PurePosixPath
          selected={1,2,3} if os.environ['PLATES']=='all' else {int(os.environ['PLATES'])}
          groups={}
          for it in json.load(open('experiments/issue37_bulk_print/sources.json'))['items']:
              if it['plate'] in selected and it.get('rebuild_from_source'):
                  groups.setdefault((it['pr'],it['head_sha']),set()).add(str(PurePosixPath(it['path']).parent.parent))
          for (pr,sha),targets in sorted(groups.items()):
              print(pr,sha,','.join(sorted(targets)),sep='\t')
          PY
          )

      - name: Load pinned legacy straight-rail mesh (not E31-verified)
        shell: bash
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r pr sha repository_path destination; do
            git fetch origin "${sha}"
            mkdir -p "build/issue37-sources/pr${pr}/$(dirname "${destination}")"
            git show "${sha}:${repository_path}" > "build/issue37-sources/pr${pr}/${destination}"
          done < <(python - <<'PY'
          import json, os
          selected={1,2,3} if os.environ['PLATES']=='all' else {int(os.environ['PLATES'])}
          for it in json.load(open('experiments/issue37_bulk_print/sources.json'))['items']:
              if it['plate'] in selected and it.get('repository_stl'):
                  print(it['pr'],it['head_sha'],it['repository_stl'],it['path'],sep='\t')
          PY
          )

      - name: Verify CAD reports and assemble selected plate STL
        run: python experiments/issue37_bulk_print/assemble.py --plates "${PLATES}"

      - name: Publish original STLs, selected plates and traceable manifest
        uses: actions/upload-artifact@v4
        with:
          name: issue37-a1mini-print-plates-${{ env.PLATES }}
          path: build/issue37-print-plates/
          retention-days: 14
          if-no-files-found: error
