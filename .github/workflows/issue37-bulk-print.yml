name: Issue 37 multi-part A1 mini print plates
on:
  push:
    paths:
      - 'experiments/issue37_bulk_print/**'
      - '.github/workflows/issue37-bulk-print.yml'
  workflow_dispatch:
    inputs:
      plates:
        description: 'Which plate to build (default: only the four representative tests)'
        required: true
        type: choice
        default: '1'
        options:
          - '1'
          - '2'
          - '3'
          - 'all'
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  build-print-plates:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PLATES: ${{ inputs.plates || '1' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install mesh library
        run: python -m pip install numpy==2.3.5
      - name: Reject superseded PR commits or mismatched CAD versions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS=
          done < <(python - <<'PY'
          import json, os
          from pathlib import PurePosixPath
          selected={1,2,3} if os.environ['PLATES']=='all' else {int(os.environ['PLATES'])}
          for it in json.load(open('experiments/issue37_bulk_print/sources.json'))['items']:
              if it['plate'] not in selected: continue
              print(it['pr'], it['head_sha'], it['id'], PurePosixPath(it['path']).parent.parent, bool(it.get('repository_stl')), sep='\t')
          PY
          )
      - name: Download pinned successful STL artifacts (each run once)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r pr run artifact; do
            echo "Downloading PR #${pr}, run ${run}, artifact ${artifact}"
            conclusion=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run}" --jq '.conclusion')
            if [[ "${conclusion}" != "success" ]]; then
              echo "::error::PR #${pr}: pinned run is not successful (${conclusion})."
              exit 1
            fi
            actual=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run}/artifacts" --jq ".artifacts[] | select(.name==\"cad-verified-stl\" and .expired==false) | .id")
            if [[ "${actual}" != "${artifact}" ]]; then
              echo "::error::Missing/expired pinned artifact for PR #${pr}: ${actual}"
              exit 1
            fi
            mkdir -p "build/issue37-sources/pr${pr}"
            gh run download "${run}" --name cad-verified-stl --dir "build/issue37-sources/pr${pr}"
          done < <(python - <<'PY'
          import json, os
          selected={1,2,3} if os.environ['PLATES']=='all' else {int(os.environ['PLATES'])}
          s=set()
          for it in json.load(open('experiments/issue37_bulk_print/sources.json'))['items']:
              if it['plate'] not in selected or it.get('rebuild_from_source') or it.get('repository_stl'): continue
              s.add((it['pr'],it['run'],it['artifact']))
          for row in sorted(s): print(*row,sep='\t')
          PY
          )
      - name: Rebuild only source-pinned models missing a successful STL artifact
        shell: bash
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r pr sha targets; do
            echo "Rebuilding CAD at immutable PR #${pr} commit ${sha}: ${targets}"
            worktree="${RUNNER_TEMP}/issue37-source-pr${pr}"
            git fetch origin "${sha}"
            git worktree add --detach "${worktree}" "${sha}"
            (
              cd "${worktree}"
              python -m pip install -r requirements.txt
              python scripts/cad_versions.py --mode build --targets "${targets}"
            )
            mkdir -p "build/issue37-sources/pr${pr}"
            cp -a "${worktree}/build/cad-delivery/." "build/issue37-sources/pr${pr}/"
          done < <(python - <<'PY'
          import json, os
          from pathlib import PurePosixPath
          selected={1,2,3} if os.environ['PLATES']=='all' else {int(os.environ['PLATES'])}
          groups={}
          for it in json.load(open('experiments/issue37_bulk_print/sources.json'))['items']:
              if it['plate'] not in selected: continue
              if it.get('rebuild_from_source'):
                  key=(it['pr'],it['head_sha'])
                  groups.setdefault(key,set()).add(str(PurePosixPath(it['path']).parent.parent))
          for (pr,sha),targets in sorted(groups.items()):
              print(pr,sha,','.join(sorted(targets)),sep='\t')
          PY
          )
      - name: Retrieve pinned repository-only legacy straight rail (no E31 validation)
        shell: bash
        run: |
          set -euo pipefail
          while IFS=
      - name: Publish printable plates and originals
        uses: actions/upload-artifact@v4
        with:
          name: issue37-a1mini-print-plates-${{ env.PLATES }}
          path: build/issue37-print-plates/
          retention-days: 14
          if-no-files-found: error
\t' read -r pr expected_sha part_id part_dir legacy; do
            if [[ "${pr}" != "0" ]]; then
              current_sha=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}" --jq '.head.sha')
              if [[ "${current_sha}" != "${expected_sha}" ]]; then
                echo "::error::PR #${pr} changed; update the pinned SHA before reuse."
                exit 1
              fi
            fi
            if [[ "${legacy}" != "True" ]]; then
              current_version=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${part_dir}/cad-build.json?ref=${expected_sha}" --jq '.content' | base64 --decode | python -c 'import sys,json; print(json.load(sys.stdin)["version"])')
              if [[ "${current_version}" != "${part_id}" ]]; then
                echo "::error::Target version ${current_version} differs from pinned ${part_id}"
                exit 1
              fi
            fi
          done < <(python - <<'PY'
          import json
          from pathlib import PurePosixPath
          for it in json.load(open('experiments/issue37_bulk_print/sources.json'))['items']:
              print(it['pr'], it['head_sha'], it['id'], PurePosixPath(it['path']).parent.parent, sep='\t')
          PY
          )
      - name: Download pinned successful STL artifacts (each run once)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r pr run artifact; do
            echo "Downloading PR #${pr}, run ${run}, artifact ${artifact}"
            conclusion=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run}" --jq '.conclusion')
            if [[ "${conclusion}" != "success" ]]; then
              echo "::error::PR #${pr}: pinned run is not successful (${conclusion})."
              exit 1
            fi
            actual=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run}/artifacts" --jq ".artifacts[] | select(.name==\"cad-verified-stl\" and .expired==false) | .id")
            if [[ "${actual}" != "${artifact}" ]]; then
              echo "::error::Missing/expired pinned artifact for PR #${pr}: ${actual}"
              exit 1
            fi
            mkdir -p "build/issue37-sources/pr${pr}"
            gh run download "${run}" --name cad-verified-stl --dir "build/issue37-sources/pr${pr}"
          done < <(python - <<'PY'
          import json
          s=set()
          for it in json.load(open('experiments/issue37_bulk_print/sources.json'))['items']:
              if it.get('rebuild_from_source'): continue
              s.add((it['pr'],it['run'],it['artifact']))
          for row in sorted(s): print(*row,sep='\t')
          PY
          )
      - name: Rebuild only source-pinned models missing a successful STL artifact
        shell: bash
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r pr sha targets; do
            echo "Rebuilding CAD at immutable PR #${pr} commit ${sha}: ${targets}"
            worktree="${RUNNER_TEMP}/issue37-source-pr${pr}"
            git fetch origin "${sha}"
            git worktree add --detach "${worktree}" "${sha}"
            (
              cd "${worktree}"
              python -m pip install -r requirements.txt
              python scripts/cad_versions.py --mode build --targets "${targets}"
            )
            mkdir -p "build/issue37-sources/pr${pr}"
            cp -a "${worktree}/build/cad-delivery/." "build/issue37-sources/pr${pr}/"
          done < <(python - <<'PY'
          import json
          from pathlib import PurePosixPath
          groups={}
          for it in json.load(open('experiments/issue37_bulk_print/sources.json'))['items']:
              if it.get('rebuild_from_source'):
                  key=(it['pr'],it['head_sha'])
                  groups.setdefault(key,set()).add(str(PurePosixPath(it['path']).parent.parent))
          for (pr,sha),targets in sorted(groups.items()):
              print(pr,sha,','.join(sorted(targets)),sep='\t')
          PY
          )
      - name: Verify source reports/SHA-256 and produce plates
        run: python experiments/issue37_bulk_print/assemble.py
      - name: Publish printable plates and originals
        uses: actions/upload-artifact@v4
        with:
          name: issue37-a1mini-print-plates
          path: build/issue37-print-plates/
          retention-days: 14
          if-no-files-found: error
\t' read -r pr sha repository_path destination; do
            git fetch origin "${sha}"
            mkdir -p "build/issue37-sources/pr${pr}/$(dirname "${destination}")"
            git show "${sha}:${repository_path}" > "build/issue37-sources/pr${pr}/${destination}"
          done < <(python - <<'PY'
          import json, os
          selected={1,2,3} if os.environ['PLATES']=='all' else {int(os.environ['PLATES'])}
          for it in json.load(open('experiments/issue37_bulk_print/sources.json'))['items']:
              if it['plate'] in selected and it.get('repository_stl'):
                  print(it['pr'],it['head_sha'],it['repository_stl'],it['path'],sep='\t')
          PY
          )
      - name: Verify source reports/SHA-256 and produce selected plates
        run: python experiments/issue37_bulk_print/assemble.py --plates "${PLATES}"
      - name: Publish printable plates and originals
        uses: actions/upload-artifact@v4
        with:
