name: PR94 one-off verified STL export
on:
  pull_request:
    paths:
      - '.github/workflows/pr94-export-once.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr94-export-once-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 94
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned CAD environment
        run: python -m pip install -r requirements.txt
      - name: Verify exact four variants and shared relief profile
        run: python -m unittest experiments.compact_curve.test -v
      - name: Export four individual and packed A1 mini STLs
        run: python -m experiments.compact_curve.export --out build/compact-curve
      - name: Verify expected STL files exist
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('build/compact-curve')
          names = [
              'X4A_4x2_downhill_sharp_curves_4parts_A1mini.stl',
              *(f'X4A-{i:02d}/brick.stl' for i in range(5, 9)),
          ]
          for name in names:
              q = p / name
              assert q.is_file() and q.stat().st_size > 84, str(q)
              print(name, q.stat().st_size, 'bytes')
          assert (p/'report.json').is_file()
          PY
      - name: Upload four-print STL artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr94-downhill-R16-4parts-X4A-V4
          path: build/compact-curve/
          if-no-files-found: error
          compression-level: 1
          retention-days: 14
