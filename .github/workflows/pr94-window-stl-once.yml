name: PR94 X4A-V6 equal-pitch five-window STL verification
on:
  pull_request:
    paths:
      - '.github/workflows/pr94-window-stl-once.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr94-windows-v6-${{ github.ref }}
  cancel-in-progress: true
jobs:
  export:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 94
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned CAD dependencies
        run: python -m pip install -r requirements.txt
      - name: Test shared R16/R48 relief and equal-pitch 5-window constraints
        run: python -m unittest experiments.compact_curve.test -v
      - name: Export individual and four-part plate STLs
        run: python -m experiments.compact_curve.export --out build/x4a-v6
      - name: Verify true 5-window tunnelling, meshes and plate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("build/x4a-v6")
          report=json.loads((p/"report.json").read_text())
          assert report["passed"]
          assert len(report["models"]) == 4
          assert [m["id"] for m in report["models"]] == [f"X4A-{i:02d}" for i in range(5,9)]
          for m in report["models"]:
              assert m["passed"] and all(m["checks"].values()), m["id"]
              assert len(m["window_removal_mm3"]) == (5 if m["tunnel"] else 0), m["id"]
              assert (p/m["id"]/"brick.stl").stat().st_size > 84
              print(m["id"], "tunnel windows", len(m["window_removal_mm3"]))
          plate=p/"X4A_4x2_downhill_sharp_curves_4parts_A1mini.stl"
          assert plate.stat().st_size > 84
          assert report["plate"]["mesh"]["passed"]
          print("A1 mini plate:",plate.stat().st_size,"bytes")
          PY
      - name: Upload tested X4A-V6 plate and 4 individual STLs
        uses: actions/upload-artifact@v4
        with:
          name: PR94-X4A-V6-five-even-windows
          path: build/x4a-v6/
          if-no-files-found: error
          compression-level: 1
          retention-days: 14
