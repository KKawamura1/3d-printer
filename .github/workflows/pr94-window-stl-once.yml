name: PR94 X4A-V5 four-window STL verification
on:
  pull_request:
    paths:
      - '.github/workflows/pr94-window-stl-once.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr94-windows-v5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 94
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CAD dependencies
        run: python -m pip install -r requirements.txt
      - name: Test port diameter, window distribution and shared R16/R48 bore
        run: python -m unittest experiments.compact_curve.test -v
      - name: Generate V5 printable STLs and geometry reports
        run: python -m experiments.compact_curve.export --out build/x4a-v5
      - name: Validate four tunnel windows and individual/plate STLs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("build/x4a-v5")
          report=json.loads((p/"report.json").read_text())
          assert report["passed"], "Export did not report pass"
          assert len(report["models"])==4
          ids=[f"X4A-{i:02d}" for i in range(5,9)]
          assert [m["id"] for m in report["models"]]==ids
          for m in report["models"]:
              assert m["passed"] and all(m["checks"].values()),m["id"]
              assert len(m["window_removal_mm3"])==(4 if m["tunnel"] else 0),m["id"]
              assert (p/m["id"]/"brick.stl").stat().st_size>84,m["id"]
              print(m["id"],"windows:",len(m["window_removal_mm3"]))
          plate=p/"X4A_4x2_downhill_sharp_curves_4parts_A1mini.stl"
          assert plate.stat().st_size>84
          assert report["plate"]["mesh"]["passed"]
          print("Validated A1 mini 4-piece STL:",plate.stat().st_size,"bytes")
          PY
      - name: Upload verified X4A-V5 four-part plate
        uses: actions/upload-artifact@v4
        with:
          name: PR94-X4A-V5-4windows-4parts
          path: build/x4a-v5/
          if-no-files-found: error
          compression-level: 1
          retention-days: 14
