name: PR13 one-time refresh printable artifacts
on:
  push:
    branches: [fix/sloped-curve-rounded-receiver]
    paths: [brickcad/sloped_curve.py]
permissions:
  contents: write
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Generate PR13 F geometry, validate and refresh STL/STEP/report
        run: |
          python -m unittest tests.test_sloped_curve -v
          python -m brickcad.sloped_curve --out examples/duplo-sloped-curve-trial-02
          python - <<'PY'
          from pathlib import Path
          import zipfile
          out=Path('examples/duplo-sloped-curve-trial-02')
          files=['brick.stl','brick.step','assembly.step','viewer.html','report.json']
          with zipfile.ZipFile('prints/duplo_sloped_curve_trial_02.zip','w',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for name in files:
                  assert (out/name).is_file(),name
                  z.write(out/name,name)
          PY
      - name: Commit updated printable assets once
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add examples/duplo-sloped-curve-trial-02/brick.stl examples/duplo-sloped-curve-trial-02/report.json prints/duplo_sloped_curve_trial_02.zip
          git status --short
          if ! git diff --staged --quiet; then
            git commit -m "Regenerate PR13 support-free F STL and verification ZIP"
            git push
          fi
