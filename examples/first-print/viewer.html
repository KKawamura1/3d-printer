 for(const obj of scene){const [tx,ty,tz,a]=obj.t,ca=Math.cos(a),sa=Math.sin(a);for(const segment of source.edges)for(const point of segment){const v=camera([point[0]*ca-point[1]*sa+tx,point[0]*sa+point[1]*ca+ty,point[2]+tz]);lines.push(2*v[0]*scale/w,-.16+2*v[1]*scale/h,-v[2]/200-.00001,...obj.color.map(c=>c/255*.50))}}
 gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(lines),gl.DYNAMIC_DRAW);gl.drawArrays(gl.LINES,0,lines.length/6);
 document.getElementById('liftText').value=(+lift.value).toFixed(1);
 const fit=data.report.fit;let row=pose.value==='aligned'?fit.insertion.find(x=>x.pair==='printed/printed'&&x.lift_mm===0):fit.poses.find(x=>x.name===pose.value);
 document.getElementById('status').textContent=mode.value!=='stack'?`CAD・STL検証: ${data.report.passed?'PASS':'FAIL'}`:(+lift.value!==0?'分解表示中。現在位置の干渉判定は未計算。':`設計上の干渉: ${row.intersection_mm3.toFixed(6)} mm³ / ${row.collision?'あり':'検出なし'}`);
 canvas.dataset.ready='true';canvas.dataset.frame=String(+(canvas.dataset.frame||0)+1);
}
canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!drag)return;yaw+=(e.clientX-drag[0])*.008;pitch=Math.max(-1.5,Math.min(1.5,pitch+(e.clientY-drag[1])*.008));drag=[e.clientX,e.clientY];draw()};canvas.onpointerup=()=>drag=null;canvas.onpointercancel=()=>drag=null;
canvas.onwheel=e=>{e.preventDefault();zoom=Math.max(.3,Math.min(4,zoom*Math.exp(-e.deltaY*.001)));draw()};
for(const el of [mode,pose,lift])el.oninput=draw;
const cameraSelect=document.getElementById('camera');
cameraSelect.oninput=()=>{const angles={perspective:[-.65,.65],top:[0,Math.PI/2],underside:[-.65,-.8],section:[0,.15]};[yaw,pitch]=angles[cameraSelect.value];zoom=1;draw()};
document.getElementById('under').onclick=()=>{pitch=-.8;draw()};document.getElementById('reset').onclick=()=>{yaw=-.65;pitch=.65;zoom=1;draw()};
document.getElementById('dims').textContent=`単位 mm / ${data.report.geometry.bounds_mm.map(x=>x.toFixed(2)).join(' × ')} / clearance ${data.report.geometry.parameters.clearance}`;
new ResizeObserver(draw).observe(canvas);draw();
</script></html>
